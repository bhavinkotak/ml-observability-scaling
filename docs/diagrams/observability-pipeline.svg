<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="observability-pipeline-title observability-pipeline-desc" id="observability-pipeline-root">
        <title id="observability-pipeline-title">ML observability scaling pipeline</title>
        <desc id="observability-pipeline-desc">Observability pipeline routing reference baselines and production model windows through statistical drift detectors, Benjamini-Hochberg false-discovery-rate control, and SLO alert routing.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #observability-pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #observability-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #observability-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#observability-pipeline-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="observability-pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="observability-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="observability-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="observability-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#observability-pipeline-dots)" opacity="0.55"/>

        <!-- Zone: Telemetry & Statistical Drift Engine -->
        <rect x="276" y="60" width="484" height="312" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="424" y="64" width="188" height="12" rx="2" fill="#f5f5f5"/>
        <text x="518" y="73" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">TELEMETRY &amp; DRIFT ENGINE</text>

        <!-- Orthogonal connectors (drawn before labels and nodes) -->
        <!-- 1. Reference Baseline -> Drift Detectors (port y=120) -->
        <line x1="208" y1="120" x2="296" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#observability-pipeline-arrow)"/>

        <!-- 2. Production Stream (port y=280) -> Drift Detectors (port y=152) -->
        <path d="M 208,280 H 244 Q 252,280 252,272 V 160 Q 252,152 260,152 H 296"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#observability-pipeline-arrow-link)"/>

        <!-- 3. Production Stream (port y=308) -> Metrics Collector (port y=308) -->
        <line x1="208" y1="308" x2="296" y2="308" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#observability-pipeline-arrow-link)"/>

        <!-- 4. Drift Detectors -> BH FDR Controller -->
        <line x1="488" y1="136" x2="556" y2="136" stroke="#bf4520" stroke-width="1.4" marker-end="url(#observability-pipeline-arrow-accent)"/>

        <!-- 5. BH FDR Controller -> SLO Alert Router (port y=120) -->
        <line x1="740" y1="120" x2="848" y2="120" stroke="#bf4520" stroke-width="1.4" marker-end="url(#observability-pipeline-arrow-accent)"/>

        <!-- 6. Metrics Collector (port y=280) -> SLO Alert Router (port y=152) -->
        <path d="M 488,280 H 788 Q 796,280 796,272 V 160 Q 796,152 804,152 H 848"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#observability-pipeline-arrow)"/>

        <!-- 7. Metrics Collector (port y=308) -> Portfolio Dashboard (port y=308) -->
        <line x1="488" y1="308" x2="848" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#observability-pipeline-arrow)"/>

        <!-- 8. SLO Alert Router -> Portfolio Dashboard -->
        <line x1="944" y1="168" x2="944" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#observability-pipeline-arrow)"/>

        <!-- Arrow label masks -->
        <rect x="224" y="100" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="252" y="109" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REF ECDF</text>

        <rect x="188" y="210" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="216" y="219" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WINDOWS</text>

        <rect x="224" y="316" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="252" y="325" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>

        <rect x="496" y="116" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="522" y="125" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P-VALS</text>

        <rect x="760" y="100" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="794" y="109" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FDR ALARMS</text>

        <rect x="608" y="260" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="269" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SLO RULES</text>

        <rect x="616" y="316" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="325" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SERIES</text>

        <rect x="952" y="210" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="984" y="219" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INCIDENTS</text>

        <!-- Node 1: Reference Baseline (store) -->
        <rect x="40" y="104" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="104" width="168" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="48" y="112" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="64" y="121" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REF</text>
        <text x="124" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reference Baseline</text>
        <text x="124" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">m=1000 · quantiles</text>

        <!-- Node 2: Production Stream (input) -->
        <rect x="40" y="264" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="264" width="168" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="272" width="36" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="66" y="281" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIVE</text>
        <text x="124" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Production Stream</text>
        <text x="124" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1000 models · 20 feats</text>

        <!-- Node 3: Drift Detectors (focal coral #1) -->
        <rect x="296" y="104" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="104" width="192" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="304" y="112" width="36" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="322" y="121" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAT</text>
        <text x="392" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Drift Detectors</text>
        <text x="392" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KS · PSI · KL · W1</text>

        <!-- Node 4: Metrics Collector (backend) -->
        <rect x="296" y="264" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="264" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="304" y="272" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="322" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TSDB</text>
        <text x="392" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Metrics Collector</text>
        <text x="392" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">p95 latency · batch err</text>

        <!-- Node 5: BH FDR Controller (focal coral #2) -->
        <rect x="556" y="104" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="556" y="104" width="184" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="564" y="112" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="580" y="121" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FDR</text>
        <text x="648" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BH FDR Controller</text>
        <text x="648" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">q=0.05 · 99.6% FA cut</text>

        <!-- Node 6: SLO Alert Router (backend) -->
        <rect x="848" y="104" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="104" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="856" y="112" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="876" y="121" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALERT</text>
        <text x="944" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SLO Alert Router</text>
        <text x="944" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">severity · 86.6% recall</text>

        <!-- Node 7: Portfolio Dashboard (store) -->
        <rect x="848" y="264" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="264" width="192" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="856" y="272" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="874" y="281" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
        <text x="944" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Portfolio Dashboard</text>
        <text x="944" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">health · kappa · audit</text>

        <!-- Bottom horizontal legend strip -->
        <line x1="40" y1="428" x2="1040" y2="428" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="460" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal drift / FDR stage</text>

        <rect x="216" y="460" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="236" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Telemetry / router</text>

        <rect x="372" y="460" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="392" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Live model stream</text>

        <rect x="536" y="460" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="556" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reference / dashboard</text>

        <line x1="712" y1="466" x2="740" y2="466" stroke="#bf4520" stroke-width="1.4" marker-end="url(#observability-pipeline-arrow-accent)"/>
        <text x="748" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">FDR alarm path</text>

        <line x1="876" y1="466" x2="904" y2="466" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#observability-pipeline-arrow-link)"/>
        <text x="912" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Telemetry ingest</text>
      </svg>
